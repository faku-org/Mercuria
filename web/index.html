<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercuria · Panel</title>
    <meta
      name="description"
      content="Mercuria: panel de simulación económica con naciones, empresas, leyes, mercado e IA."
    />
    <script>
      // Aplica el tema antes del primer pintado para evitar destellos.
      try {
        var guardado = localStorage.getItem("mercuria.tema");
        if (guardado !== "claro" && guardado !== "oscuro") {
          guardado = matchMedia("(prefers-color-scheme: dark)").matches ? "oscuro" : "claro";
        }
        document.documentElement.setAttribute(
          "data-theme",
          guardado === "oscuro" ? "dark" : "light",
        );
      } catch (e) {}
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23831c91' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Merriweather:wght@300..900&family=Source+Serif+4:opsz,wght@8..60,400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
